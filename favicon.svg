<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3f77d8"/>
      <stop offset="0.55" stop-color="#23397a"/>
      <stop offset="1" stop-color="#121830"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#9dbcff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9dbcff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurStar" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#070b18" flood-opacity="0.6"/>
    </filter>
    <path id="spark" d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z"/>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>

  <!-- B: Corinthia script outline (Open Font License), scaled to fit -->
  <g filter="url(#lift)">
  <path transform="translate(13.332 48.690) scale(0.05806 -0.05806)" d="M206 -57Q140 -57 79 -31Q1 2 1 60Q1 127 65 170Q94 189 125.0 198.5Q156 208 190 210Q207 250 232.5 303.0Q258 356 283 402Q291 416 304.0 439.5Q317 463 335 490Q350 512 386 512Q400 512 400 504Q400 502 398 498Q304 371 224 210Q449 206 559 109Q591 152 591 188Q591 251 506 287Q440 314 366 314H343Q330 314 330 323Q330 341 359 346Q364 347 379.5 349.0Q395 351 407 353Q528 377 584 430Q607 451 607 468Q607 504 514 522Q451 534 384 534Q205 534 48 469Q42 467 40 467Q32 467 32 475Q32 488 45 501Q59 516 71 521Q175 563 336 563Q432 563 514 545Q642 518 642 459Q642 411 564 372Q507 343 443 332Q514 316 565 285Q635 243 635 184Q635 136 586 81Q615 46 615 30Q615 16 604 16Q599 16 596 21Q589 35 582.0 45.0Q575 55 568 62Q504 2 398 -30Q307 -57 206 -57ZM206 -35Q428 -35 541 87Q485 134 400 161Q321 186 241 186Q234 186 226.5 186.0Q219 186 212 185Q152 58 152 14Q152 9 153 6Q154 3 154 -2Q154 -15 143 -15Q127 -15 127 12Q127 57 178 181Q45 159 45 58Q45 13 106 -14Q154 -35 206 -35Z" fill="#ffffff"/>
  </g>

  <!-- sparkles: soft, tall back stars for depth; crisp, taller front stars -->
  <g filter="url(#blurStar)">
    <use href="#spark" transform="translate(15 12) scale(2.8 5)" fill="#ffe9a8"/>
    <use href="#spark" transform="translate(9 33) scale(2 3.6)" fill="#dfe9ff"/>
    <use href="#spark" transform="translate(54 50) scale(2 3.8)" fill="#ffe9a8"/>
  </g>
  <use href="#spark" transform="translate(47 11) scale(4.8 8.6)" fill="#f5c451" filter="url(#glow)"/>
  <use href="#spark" transform="translate(56 29) scale(2.4 4.4)" fill="#ffffff" filter="url(#glow)"/>
</svg>
