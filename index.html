<!DOCTYPE html>
<html lang="en" data-theme="castle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Disney World Trip Plan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1c3d8f">
  <script>
    try {
      const m = localStorage.getItem("disney-mode");
      const dark = m ? m === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.dataset.mode = "dark";
      if (localStorage.getItem("disney-compact") === "1") document.documentElement.dataset.compact = "1";
    } catch (e) { /* storage unavailable */ }
  </script>
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
  <main id="lock" class="lock">
    <h1>Disney World Trip</h1>
    <p>Enter the passcode to view the plan.</p>
    <form id="unlock-form">
      <label class="code-field">
        <span class="dots" id="dots" aria-hidden="true"></span>
        <input id="passcode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" autofocus aria-label="Passcode">
      </label>
      <div class="keypad" id="keypad">
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-util" id="key-clear" aria-label="Clear">Clear</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key key-util" id="key-back" aria-label="Delete">&#9003;</button>
      </div>
      <label class="remember"><input type="checkbox" id="remember" checked> Remember on this device</label>
      <button type="submit" class="unlock-btn">Unlock</button>
    </form>
    <p id="lock-error" class="error" hidden>Wrong passcode. Try again.</p>
  </main>

  <main id="app" hidden>
    <header>
      <div class="brand">
        <img class="logo" src="logo.png?v=1" alt="" width="36" height="36">
        <div>
          <h1>Disney World 2026</h1>
          <p class="sub">Nov 21–26, 2026 · Caribbean Beach</p>
        </div>
      </div>
      <div class="hdr-right">
        <div class="swatches" role="group" aria-label="Site theme">
          <button type="button" class="swatch" data-theme="sunset" aria-label="Sunset theme" aria-pressed="false"></button>
          <button type="button" class="swatch" data-theme="castle" aria-label="Castle blue theme" aria-pressed="false"></button>
          <button type="button" class="swatch" data-theme="teal" aria-label="Tomorrowland teal theme" aria-pressed="false"></button>
          <button type="button" class="mode-toggle" id="compact-toggle" aria-label="Compact cards" aria-pressed="false">☰</button>
          <button type="button" class="mode-toggle" id="mode-toggle" aria-label="Dark mode" aria-pressed="false">☾</button>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="now" role="tab" hidden>Now</button>
      <button class="tab active" data-tab="itinerary" role="tab">Itinerary</button>
      <button class="tab" data-tab="attractions" role="tab">Attractions</button>
      <button class="tab" data-tab="travel" role="tab">Travel &amp; Rooms</button>
      <button class="tab" data-tab="open" role="tab">Advice <span class="tab-count" id="advice-count" hidden></span></button>
    </nav>

    <section id="now" class="panel">
      <div class="filters">
        <div class="chips" id="now-group-chips" aria-label="Choose your group"></div>
        <div class="chips" id="tl-day-chips" aria-label="Choose a day"></div>
      </div>
      <div id="now-top"></div>
      <h2 class="sec">Where's everyone</h2>
      <div id="timeline"></div>
      <div id="now-list"></div>
    </section>

    <section id="itinerary" class="panel active">
      <div class="filters">
        <div class="chips" id="group-chips" aria-label="Filter by group"></div>
        <div class="chips" id="day-chips" aria-label="Filter by day"></div>
        <div class="chips" id="type-chips" aria-label="Filter by type"></div>
        <input id="search" type="search" placeholder="Search events, parks, notes">
        <button type="button" id="add-calendar" class="act wide">Add this group's plans to my calendar</button>
      </div>
      <div id="days"></div>
    </section>

    <section id="attractions" class="panel">
      <div class="chips" id="attr-chips" aria-label="Filter attractions"></div>
      <input id="attr-search" type="search" placeholder="Search rides, shows, characters" aria-label="Search attractions">
      <div id="attractions-list"></div>
    </section>

    <section id="travel" class="panel">
      <h2>Flights</h2>
      <div id="flights"></div>
      <h2>Rooms</h2>
      <div id="rooms"></div>
    </section>

    <section id="open" class="panel">
      <div class="chips" id="advice-group-chips" aria-label="Filter advice by group"></div>
      <div id="advice"></div>
    </section>
  </main>

  <div id="editor" class="editor" hidden></div>
  <footer class="app-footer">
    <span id="sync-status" class="sync-status"></span>
    <button type="button" id="refresh" class="forget">Refresh</button>
    <button type="button" id="reset-edits" class="forget">Undo all edits</button>
    <a class="forget" href="https://apps.apple.com/app/id547436543" target="_blank" rel="noopener">Open Disney app ↗</a>
    <button type="button" id="forget" class="forget" hidden>Forget this device</button>
  </footer>

  <script src="app.js?v=38"></script>
</body>
</html>
